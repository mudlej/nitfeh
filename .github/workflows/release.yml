name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches the version in Cargo.toml
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  publish:
    needs: [version, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          sha256sum nitfeh-linux-x86_64 nitfeh-windows-x86_64.exe Nitfeh-macos.dmg > SHA256SUMS
          cat > notes.md <<'NOTES'
          One file per system; nothing to install. Start it without arguments for the window, or give it
          a file or a folder to convert from a terminal (`--help` lists the options).

          | System | File | First start |
          |---|---|---|
          | Linux (x86-64, glibc 2.35 or newer) | `nitfeh-linux-x86_64` | `chmod +x nitfeh-linux-x86_64` |
          | Windows 10 and 11 (x86-64) | `nitfeh-windows-x86_64.exe` | SmartScreen: "More info", then "Run anyway" |
          | macOS 11 or newer (Intel and Apple silicon) | `Nitfeh-macos.dmg` | Open it and drag Nitfeh to Applications; the first time, right-click the app and choose Open |

          The files are not signed with a paid certificate, which is why Windows and macOS ask the first time.
          On macOS the command line is inside the app: `/Applications/Nitfeh.app/Contents/MacOS/nitfeh`.
          NOTES
          gh release create "$GITHUB_REF_NAME" nitfeh-linux-x86_64 nitfeh-windows-x86_64.exe Nitfeh-macos.dmg SHA256SUMS \
            --title "Nitfeh $VERSION" --notes-file notes.md --generate-notes --verify-tag
