# Builds and tries the single file for each system. Called by ci.yml and release.yml.
name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    # The oldest runner on purpose: the file runs wherever glibc is at least this one's (2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: just check
      - run: just dist-linux
      - run: just smoke work/dist/nitfeh-linux-x86_64
      - name: The glibc it needs
        run: objdump -T work/dist/nitfeh-linux-x86_64 | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nitfeh-linux-x86_64
          path: work/dist/nitfeh-linux-x86_64
          if-no-files-found: error

  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: just dist-windows
      - name: Only DLLs that ship with Windows
        run: |
          x86_64-w64-mingw32-objdump -p work/dist/nitfeh-windows-x86_64.exe | grep 'DLL Name' | sort -u
          ! x86_64-w64-mingw32-objdump -p work/dist/nitfeh-windows-x86_64.exe | grep -Ei 'DLL Name: lib(gcc|winpthread|stdc|ssp)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nitfeh-windows-x86_64.exe
          path: work/dist/nitfeh-windows-x86_64.exe
          if-no-files-found: error

  # The cross-built exe, started on a real Windows.
  windows-run:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nitfeh-windows-x86_64.exe
      - shell: bash
        run: tool/smoke.sh ./nitfeh-windows-x86_64.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: just dist-macos
      - run: just smoke work/dist/Nitfeh.app/Contents/MacOS/nitfeh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nitfeh-macos.zip
          path: work/dist/Nitfeh-macos.zip
          if-no-files-found: error
