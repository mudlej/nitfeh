# nitfeh development box.
#
# Create, enter, and use:
#   distrobox assemble create --file distrobox.ini
#   distrobox enter nitfeh
#   just run
#
# One-shots from the host:   distrobox enter nitfeh -- just check
# Reconcile after editing:   distrobox assemble create --file distrobox.ini --replace
# Remove (source untouched): distrobox assemble rm --file distrobox.ini
#
# Debian 12 toolbox image, by tag. The image carries the system pieces (the C
# toolchain, mingw-w64 and wine for the Windows file, nasm, the fontconfig headers
# and the display libraries the window loads, ffmpeg for the tests' sample files,
# the headless Xvfb/scrot lane, shellcheck).
#
# The init hooks run as root at every container start and are idempotent: they
# install checksum-verified Just into /usr/local/bin and rustup into /opt/cargo
# (toolchains in /opt/rustup, both writable by you), so nothing has to be run by
# hand after creating the box. The Rust pinned in rust-toolchain.toml installs
# itself the first time a recipe runs, and recipes build FFmpeg and libopus when
# they are missing. ./first_time_setup.sh is only for working outside the box.
#
# The host home directory is shared, so the checkout is the host's. Wayland/X11
# sockets pass through, so `just run` opens the window on your desktop.
#
# Keep hook commands free of shell single quotes and `${variable#pattern}`:
# some Distrobox assemble versions mangle these while parsing INI values.

[nitfeh]
image=quay.io/toolbx-images/debian-toolbox:12
additional_packages="bash build-essential ca-certificates curl ffmpeg file git libfontconfig-dev libwayland-client0 libx11-6 libx11-xcb1 libxcursor1 libxi6 libxkbcommon-x11-0 libxkbcommon0 mingw-w64 nasm pkg-config procps python3-pil scrot shellcheck tar wine xauth xdotool xvfb xz-utils"
additional_flags="--env RUSTUP_HOME=/opt/rustup --env CARGO_HOME=/opt/cargo"

init_hooks=(set -eu; v=1.58.0; s=4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d; if [ "$(/usr/local/bin/just --version 2>/dev/null || true)" != "just $v" ]; then t=$(mktemp -d); curl -fsSL --retry 3 -o "$t/just.tgz" "https://github.com/casey/just/releases/download/$v/just-$v-x86_64-unknown-linux-musl.tar.gz"; printf "%s *%s\n" "$s" "$t/just.tgz" | sha256sum -c --quiet; tar -xzf "$t/just.tgz" -C "$t" just; install -m 0755 "$t/just" /usr/local/bin/just; rm -rf "$t"; fi);

init_hooks=(set -eu; v=1.29.3; s=b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55; if [ ! -x /opt/cargo/bin/rustup ]; then t=$(mktemp -d); curl -fsSL --retry 3 -o "$t/rustup-init" "https://static.rust-lang.org/rustup/archive/$v/x86_64-unknown-linux-gnu/rustup-init"; printf "%s *%s\n" "$s" "$t/rustup-init" | sha256sum -c --quiet; chmod +x "$t/rustup-init"; RUSTUP_HOME=/opt/rustup CARGO_HOME=/opt/cargo "$t/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none; rm -rf "$t"; chmod -R a+rwX /opt/rustup /opt/cargo; fi);

init_hooks=printf "%s\n" "export PATH=\"/opt/cargo/bin:\$PATH\"" > /etc/profile.d/nitfeh.sh;

hostname=nitfeh-dev
init=false
nvidia=false
pull=true
root=false
start_now=true
