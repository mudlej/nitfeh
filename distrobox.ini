# istma development box.
#
# Create, enter, bootstrap:
#   distrobox assemble create --file distrobox.ini
#   distrobox enter istma
#   ./first_time_setup.sh
#   just run
#
# One-shots from the host:   distrobox enter istma -- just check
# Reconcile after editing:   distrobox assemble create --file distrobox.ini --replace
# Remove (source untouched): distrobox assemble rm --file distrobox.ini
#
# Debian 12 toolbox image, by tag. Debian 12 on purpose: a release file built here
# runs on any distribution with glibc 2.36 or newer. The image carries the system
# pieces only (the C toolchain, mingw-w64 and wine for the Windows file, nasm, the
# fontconfig headers and the display libraries the window loads, ffmpeg for the
# tests' sample files, the headless Xvfb/scrot lane, shellcheck); Just and the Rust
# pinned in rust-toolchain.toml come from ./first_time_setup.sh. The host home
# directory is shared, so the checkout, ~/.cargo and ~/.rustup are the host's.
# Wayland/X11 sockets pass through, so `just run` opens the window on your desktop.

[istma]
image=quay.io/toolbx-images/debian-toolbox:12
additional_packages="bash build-essential ca-certificates curl ffmpeg file git libfontconfig-dev libwayland-client0 libx11-6 libx11-xcb1 libxcursor1 libxi6 libxkbcommon-x11-0 libxkbcommon0 mingw-w64 nasm pkg-config procps python3-pil scrot shellcheck tar wine xauth xdotool xvfb xz-utils"
hostname=istma-dev
init=false
nvidia=false
pull=true
root=false
start_now=true
